<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fake Challenge</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; font: 18px/1.4 system-ui, sans-serif; background: #f3f4f6; }
  .card { width: 420px; padding: 32px; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px #0002; text-align: center; }
  button { margin-top: 24px; padding: 14px 28px; font: inherit; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
  #status { margin-top: 16px; color: #6b7280; }
  body[data-cleared="true"] .card { outline: 4px solid #16a34a; }
</style>
</head>
<body>
<div class="card">
  <div>Prove you are human to continue.</div>
  <button id="verify">I'm not a robot</button>
  <div id="status">Not cleared.</div>
</div>
<script>
  // Only a trusted click clears the Challenge, as with a real one.
  document.getElementById("verify").addEventListener("click", (e) => {
    const status = document.getElementById("status");
    if (!e.isTrusted) {
      status.textContent = "Untrusted click rejected.";
      return;
    }
    document.body.dataset.cleared = "true";
    status.textContent = "Cleared ✓";
  });
</script>
</body>
</html>
